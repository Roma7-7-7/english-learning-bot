name: Go Vulnerability Check

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    # Run daily at 6:00 AM
    - cron: "0 6 * * *"

permissions:
  contents: read
  issues: write

jobs:
  govulncheck:
    name: Run govulncheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: "1.26.6"

      - name: Report vulnerabilities
        if: failure()
        run: |
          echo "::error::Vulnerabilities found! Please review the output above."
          echo "Visit https://pkg.go.dev/vuln/ for more information on vulnerabilities."
